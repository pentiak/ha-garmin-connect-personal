# Every hook runs a tool from the project venv (`pip install -r requirements_test.txt`), so pre-commit
# downloads nothing. Install the git hook with `.venv/bin/pre-commit install`.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^\.secrets\.baseline$
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: .venv/bin/zizmor --offline
        language: system
        files: ^\.github/
        pass_filenames: false
        args: ["."]
