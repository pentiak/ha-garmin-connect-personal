name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/garmin_connect_personal/manifest.json)
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v} " \
            'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md
      # HACS installs from GitHub releases, so this release is what users get.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --notes-file release-notes.md
